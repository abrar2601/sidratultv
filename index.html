<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Sidratul Tv </title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        :root {
            --bg-color: #0f0f12;
            --sidebar-color: #1a1a1f;
            --accent-color: #6c5ce7;
            --text-color: #ffffff;
            --btn-bg: #2f3542;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Design */
        .sidebar {
            width: 300px;
            background-color: var(--sidebar-color);
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .sidebar h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 25px;
            color: var(--text-color);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar h2 span {
            color: var(--accent-color);
        }

        .channel-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex-grow: 1;
        }

        /* প্রিমিয়াম বাটন স্টাইল */
        .channel-btn {
            background-color: var(--btn-bg);
            color: var(--text-color);
            border: none;
            padding: 14px 18px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.25s ease;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .channel-btn:hover {
            background-color: #3e4453;
            transform: translateX(4px);
        }

            background-color: var(--accent-color);
